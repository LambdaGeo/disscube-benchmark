# disscube-benchmark / terrame_fill — TerraME "Fill" example Amazônia
#
# The same cellular space and layers as terrame/amazonia.lua, declared for DisSCube. Inputs are
# TerraME's own `gis` package data (LGPL, INPE/TerraLAB) fetched from github.com/TerraME/terrame
# (commit 84faddc) and SHA-256-verified; a shapefile's .shx/.dbf/.prj are declared as extra
# sources (`<id>_shx` ...) so DisSCube downloads them next to the .shp.
#
#     disscube validate amazonia.toml
#     disscube run amazonia.toml --workspace data/amazonia
#
# TerraME                                     DisSCube
# fill{operation = "coverage"}                operator = "percentage"
# fill{operation = "distance"}                operator = "distance"
# fill{operation = "area"}                    operator = "area"

schema = 1
name = "TerraME Fill example — Amazônia (parity case)"

# Same grid as TerraME: 50 km cells over the bounds of its cells layer (SAD69 / UTM 21S).
# TerraME built it with input = "limit", so its 2 229 cells are a subset of this rectangle;
# cells are matched by centre in compare.py.
[grid]
name = "amazonia_50km"
crs = "EPSG:29191"
bbox = [-2205525.420188459, -1995806.6413792633, 1394474.579811541, 604193.3586207367]
resolution = 50000

