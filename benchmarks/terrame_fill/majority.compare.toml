# Comparison spec for the TerraME "mode" case: DisSCube vs the luccme-goldens fill reference.
#
#   kind = "categorical"   -> class values, not measurements. The golden column is text: one class
#                             ("7") or, on a tie, every tied class ("7,87"). A cell agrees when
#                             DisSCube's class is among the golden ones. The criterion is
#                             min_share (share of agreeing cells); no error metrics are computed.

[dataset]
name      = "majority"
# Pinned to a luccme-goldens COMMIT, not a release: raw URLs by commit are immutable and no tag
# is needed. When the goldens get their next release, change only the commit to the tag (the
# bytes, and so the SHA-256, do not change).
reference_url    = "https://raw.githubusercontent.com/LambdaGeo/luccme-goldens/4b7c7419bb809485f82c3bad9e0ce2e1b3f4ee36/goldens/fill/majority_terrame.csv"
reference_sha256 = "8c9bf6ff53cfae4443196d6d11191526a8b5ca6b29f9e2615fdefe88c9ff3d90"
grid      = "itaituba_5km"
crs       = "EPSG:29191"

[[compare]]
variable  = "defor_mode"
reference = "defor_mode"
kind      = "categorical"
min_share = 1.0             # 100 % of the 620 cells agree (no ties in this raster)
nan_ref   = 0.0             # cells without source pixels: NaN in DisSCube, `missing` (0) in TerraME
expect    = "match"
note      = "mode / majority: predominant class per cell; TerraME lists all tied classes, DisSCube takes the smallest"
