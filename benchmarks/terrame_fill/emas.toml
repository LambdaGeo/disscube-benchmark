# disscube-benchmark / terrame_fill — TerraME "Fill" example Emas (Parque Nacional das Emas)
#
# The same cellular space and layers as terrame/emas.lua, declared for DisSCube. Inputs are
# TerraME's own `gis` package data (LGPL, INPE/TerraLAB) fetched from github.com/TerraME/terrame
# (commit 84faddc) and SHA-256-verified; a shapefile's .shx/.dbf/.prj are declared as extra
# sources (`<id>_shx` ...) so DisSCube downloads them next to the .shp.
#
#     disscube validate emas.toml
#     disscube run emas.toml --workspace data/emas
#
# TerraME                                     DisSCube
# fill{operation = "presence"}                operator = "presence"
# fill{operation = "maximum"}                 operator = "max"
# fill{operation = "minimum"}                 operator = "min"

schema = 1
name = "TerraME Fill example — Emas (parity case)"

# Same grid as TerraME: 500 m cells over the bounds of its cells layer (SAD69 / UTM 22S).
# TerraME built it with input = "limit", so its 5 514 cells are a subset of this rectangle
# (cells touching the park limit); cells are matched by centre in compare.py.
[grid]
name = "emas_500m"
crs = "EPSG:29192"
bbox = [275773.531595, 7970379.191738276, 316273.531595, 8024379.191738276]
resolution = 500

[[source]]
id = "cover"
type = "file"
path = "terrame_fill/emas-accumulation.tif"
crs = "EPSG:29192"
url = "https://raw.githubusercontent.com/TerraME/terrame/84faddc4e5149a89d7486444b61b8c50474e199c/packages/gis/data/emas-accumulation.tif"
sha256 = "d3ef918861c36c46a7333d79346dbb54a3e48b80468787715ddd5ef317e2e58a"

