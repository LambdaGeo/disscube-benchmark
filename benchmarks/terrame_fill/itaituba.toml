[[derive]]
target = "elevation"
source = "elevation"
operator = "mean"

# TerraME's "defor" fill creates one attribute per class (defor_<code>).
# The classes compared here are 7, 87, 167 and 255.
[[derive]]
target = "defor_7"
source = "deforestation"
operator = "percentage"
class_code = 7

[[derive]]
target = "defor_87"
source = "deforestation"
operator = "percentage"
class_code = 87

[[derive]]
target = "defor_167"
source = "deforestation"
operator = "percentage"
class_code = 167

[[derive]]
target = "defor_255"
source = "deforestation"
operator = "percentage"
class_code = 255

[[derive]]
target = "distroad"
source = "roads"
operator = "distance"

[[derive]]
target = "distlocal"
source = "localities"
operator = "distance"

# Census tracts: population shared among the cells in proportion to the intersected area.
[[derive]]
target = "population"
source = "census"
operator = "sum"
params = { area = true }
