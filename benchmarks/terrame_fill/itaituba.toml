# disscube-benchmark / terrame_fill — TerraME "Fill" tutorial (Itaituba, Pará)
#
# The same cellular space and layers as terrame/itaituba.lua, declared for DisSCube.
# Input layers are TerraME's own `gis` package data (LGPL, INPE/TerraLAB), fetched straight
# from github.com/TerraME/terrame (commit 84faddc) and SHA-256-verified. Nothing is stored in git.
# A shapefile is several files upstream, so its .shx/.dbf/.prj are declared as extra sources
# (`<id>_shx` ...); they only make DisSCube download them next to the .shp.
#
#     disscube validate itaituba.toml
#     disscube run itaituba.toml --workspace data/itaituba
#
# TerraME                                     DisSCube
# fill{operation = "average"}                 operator = "mean"
# fill{operation = "coverage"}                operator = "percentage"
# fill{operation = "distance"}                operator = "distance"
# fill{operation = "sum", area = true}        operator = "sum", params = { area = true }

schema = 1
name = "TerraME Fill tutorial — Itaituba (parity case)"

# Same grid as TerraME: 5 km cells over the bounds of the census layer.
# TerraME's reference .prj is wrong (NAD83_Austin); the real CRS is SAD69 / UTM 21S.
[grid]
name = "itaituba_5km"
crs = "EPSG:29191"
bbox = [547177.3501989994, 9485214.18712, 702177.3501989994, 9585214.18712]
resolution = 5000

