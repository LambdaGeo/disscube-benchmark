# disscube-benchmark / terrame_fill — TerraME GPM Network Connectivity (GTC to ports)
#
# Declarative pipeline for DisSCube reproducing Generalized Transport Cost (GTC)
# travel distance to Brazilian ports over a linear transport network (br_roads_5880).
# Inputs are official TerraME GPM package data (EPSG:5880 / SIRGAS 2000 Polyconic)
# fetched from github.com/TerraME/gpm (master branch) with SHA-256 verification.
#
#     disscube validate connectivity.toml
#     disscube run connectivity.toml --workspace data/connectivity
#

schema = 1
name = "TerraME GPM Network Connectivity — GTC to Ports (parity case)"

[grid]
name = "br_25km"
crs = "EPSG:5880"
resolution = 25000.0
bbox = [2794537.21, 6263674.49, 7619537.21, 10588674.49]

